name: Release VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check version
        run: |
          [xml]$project = Get-Content src/VsMcp.Vsix/VsMcp.Vsix.csproj -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          [xml]$manifest = Get-Content src/VsMcp.Vsix/source.extension.vsixmanifest -Raw
          $manifestVersion = $manifest.SelectSingleNode('//*[local-name()="Identity"]').GetAttribute('Version')
          if ($manifestVersion -ne $version) { throw 'Project and VSIX manifest versions must match.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "The release tag must be v$version."
          }

      - name: Build Release VSIX
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -version '[18.0,19.0)' -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild/Current/Bin/MSBuild.exe'
          if (-not $msbuild) { throw 'Visual Studio 2026 MSBuild was not found.' }
          & $msbuild src/VsMcp.Vsix/VsMcp.Vsix.csproj -restore -p:Configuration=Release -v:minimal -nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $msbuild tests/VsMcp.ToolCatalog/VsMcp.ToolCatalog.csproj -restore -p:Configuration=Release -v:minimal -nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tests/VsMcp.ToolCatalog/bin/Release/net472/VsMcp.ToolCatalog.exe src/VsMcp.Bridge/tools.json --check

      - name: Run unit tests
        run: |
          dotnet test tests/VsMcp.UnitTests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/VsMcp.BridgeTests -c Release

      - name: Run protocol harness
        run: |
          dotnet build tests/VsMcp.Harness -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tests/VsMcp.Harness/bin/Release/net472/VsMcp.Harness.exe

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: VsMcp-vsix
          path: src/VsMcp.Vsix/bin/Release/net472/VsMcp.vsix
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" src/VsMcp.Vsix/bin/Release/net472/VsMcp.vsix --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" src/VsMcp.Vsix/bin/Release/net472/VsMcp.vsix --verify-tag --title "$env:GITHUB_REF_NAME" --generate-notes
          }
